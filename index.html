<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Court - Elige tu Restaurante</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen pb-12">

    <!-- Encabezado del Food Court -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-md mx-auto px-4 py-4 text-center">
            <h1 class="font-extrabold text-xl text-gray-900"><i class="fa-solid fa-utensils text-red-500 mr-2"></i>Pedidos michi 🐈</h1>
            <p class="text-xs text-gray-500 mt-0.5">Elige tu restaurante favorito y pide a domicilio</p>
        </div>
    </header>

    <!-- Contenedor de Restaurantes (Boxes Dinámicas) -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <h2 class="font-bold text-sm text-gray-700 uppercase tracking-wider">Restaurantes Disponibles</h2>
        
        <div id="lista-restaurantes" class="space-y-3">
            <div class="text-center py-10">
                <i class="fa-solid fa-spinner animate-spin text-2xl text-gray-400 mb-2"></i>
                <p class="text-xs text-gray-500">Cargando restaurantes...</p>
            </div>
        </div>
    </main>

    <script>
        // Usa el mismo enlace de tu Google Apps Script compartido
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyWH07ZK-G12J3-i-YHPqYlbN8bN5oz_hcdutl5wdYXAM_C_D0HIl1bEh0OWd6ISDlY/exec';

        window.onload = async function() {
            try {
                let response = await fetch(APPS_SCRIPT_URL);
                let datos = await response.json();
                renderizarRestaurantes(datos);
            } catch (error) {
                console.error("Error al cargar el food court:", error);
                document.getElementById('lista-restaurantes').innerHTML = `
                    <p class="text-xs text-red-500 text-center py-6">Error al conectar con el directorio de tiendas.</p>
                `;
            }
        };

        function renderizarRestaurantes(productos) {
            const contenedor = document.getElementById('lista-restaurantes');
            contenedor.innerHTML = '';

            // Filtrar y agrupar por slugs únicos para obtener una lista de restaurantes
            const mapRestaurantes = {};
            productos.forEach(p => {
                if (p.slug && !mapRestaurantes[p.slug]) {
                    mapRestaurantes[p.slug] = {
                        slug: p.slug,
                        nombreRestaurante: p.nombreRestaurante || p.slug,
                        imagenReferencia: p.imagenUrl || 'https://via.placeholder.com/150'
                    };
                }
            });

            const restaurantes = Object.values(mapRestaurantes);

            if (restaurantes.length === 0) {
                contenedor.innerHTML = `
                    <div class="text-center py-12 px-4 bg-white rounded-2xl shadow-sm">
                        <i class="fa-solid fa-store-slash text-3xl text-gray-300 mb-3"></i>
                        <h3 class="font-bold text-gray-800 text-sm">No hay restaurantes abiertos</h3>
                        <p class="text-xs text-gray-500 mt-1">Vuelve más tarde o registra una tienda nueva.</p>
                    </div>
                `;
                return;
            }

            // Crear las "Boxes" dinámicamente por cada restaurante detectado
            restaurantes.forEach(tienda => {
                contenedor.innerHTML += `
                    <a href="menu.html?tienda=${tienda.slug}" class="bg-white p-4 rounded-2xl shadow-sm border flex items-center justify-between gap-4 hover:shadow-md transition group">
                        <div class="flex items-center space-x-3.5">
                            <img src="${tienda.imagenReferencia}" class="w-14 h-14 object-cover rounded-xl border flex-shrink-0 group-hover:scale-105 transition">
                            <div>
                                <h3 class="font-bold text-sm text-gray-900 group-hover:text-black">${tienda.nombreRestaurante}</h3>
                                <p class="text-[11px] text-green-600 font-medium mt-0.5 flex items-center gap-1">
                                    <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> Abierto • Ver Menú
                                </p>
                            </div>
                        </div>
                        <div class="bg-gray-100 group-hover:bg-black group-hover:text-white text-gray-600 w-8 h-8 rounded-full flex items-center justify-center transition">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </div>
                    </a>
                `;
            });
        }
    </script>
</body>
</html>
