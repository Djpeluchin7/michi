<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - Pedidos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen pb-12">

    <!-- Encabezado del Restaurante con el Carrito a la Derecha -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-black text-white w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg shadow-sm">
                    <i class="fa-solid fa-store text-lg"></i>
                </div>
               
                
                <div>
                    <h1 id="nombre-restaurante" class="font-bold text-base text-gray-900">Cargando productos...</h1>
                    <p class="text-xs text-green-600 font-medium flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Abierto para pedidos
                    </p>
  <button class="bg-orange-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-orange-600 shadow" ><a  href="index.html"> Volver a inicio</a>
                </div>
            </div>

            <!-- Botón del Carrito en el Encabezado (Oculto si está vacío) -->
            <button id="btn-carrito-header" onclick="abrirModalCarrito()" class="bg-black hover:bg-gray-800 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-md transition flex items-center space-x-2 hidden">
                <i class="fa-solid fa-bag-shopping text-sm"></i>
                <span>(<span id="cantidad-items-header">0</span>) <span id="total-carrito-header">$0.00</span></span>
            </button>
        </div>
    </header>

    <!-- Contenedor Principal del Menú -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="flex justify-between items-center mb-2">
            <h2 class="font-extrabold text-lg text-gray-800">Menú Disponible</h2>
            <span id="contador-productos" class="text-xs bg-gray-200 text-gray-700 font-bold px-2.5 py-1 rounded-full">0 items</span>
        </div>

        <!-- Lista Dinámica de Productos -->
        <div id="lista-productos" class="space-y-3">
            <div class="text-center py-10">
                <i class="fa-solid fa-spinner animate-spin text-2xl text-gray-400 mb-2"></i>
                <p class="text-xs text-gray-500">Buscando productos del menú...</p>
            </div>
        </div>
    </main>

    <!-- Modal del Carrito de Compras (Centrado a la mitad de la pantalla) -->
    <div id="modal-carrito" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl max-h-[50vh] flex flex-col shadow-2xl animate-fade-in">
            
            <!-- Cabecera del Modal -->
            <div class="p-3 border-b flex justify-between items-center">
                <h3 class="font-bold text-base text-gray-900 flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping text-black"></i> Tu Carrito
                </h3>
                <button onclick="cerrarModalCarrito()" class="text-gray-400 hover:text-gray-600 p-1.5 rounded-full">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Lista de Ítems en el Carrito con Cantidad -->
            <div id="items-carrito" class="p-3 space-y-3 overflow-y-auto flex-1">
                <!-- Se inyectan dinámicamente -->
            </div>

            <!-- Resumen y Botón de WhatsApp -->
            <div class="p-3 border-t bg-gray-50 space-y-2.5 rounded-b-3xl">
                <div class="flex justify-between items-center pt-1">
                    <span class="text-xs font-bold text-gray-600">Total a pagar:</span>
                    <span id="total-carrito-modal" class="text-base font-extrabold text-gray-900">$0.00</span>
                </div>

                <button onclick="enviarPedidoWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2 text-xs">
                    <i class="fa-brands fa-whatsapp text-base"></i>
                    <span>Enviar Pedido por WhatsApp</span>
                </button>
            </div>

        </div>
    </div>

    <!-- Script de lógica de la tienda -->
